<!doctype html>
<!--
  Marathon Coach – Prototype v2 (Team 6) – COACH APP
  Open index.html (the login page) and log in as the coach to get here.

  This page is almost empty on purpose: the JavaScript files below draw
  each screen into the <div id="app"> box.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- These let the page open full-screen when added to a phone's home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Marathon Coach">
  <meta name="theme-color" content="#111827">
  <title>Marathon Coach – Coach</title>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-app="coach">
  <!-- Every screen is drawn inside this box -->
  <div id="app"></div>

  <!--
    The order matters: each file uses things defined in the files above it.
      1. data.js         – the sample runners, sessions and plans
      2. state.js        – what the app remembers while you click around
      3. helpers.js      – small reusable functions (formatting, counting)
      4. ai-advisor.js   – the rules behind the "AI suggestion" panel
      5. components.js   – pieces used on many screens (header, menu, dots)
      6. screens/*.js    – one file per screen
      7. app.js          – draws the current screen and handles clicks
  -->
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/ai-advisor.js"></script>
  <script src="js/screens/components.js"></script>
  <script src="js/screens/group.js"></script>
  <script src="js/screens/runner-detail.js"></script>
  <script src="js/screens/edit-session.js"></script>
  <script src="js/screens/plans.js"></script>
  <script src="js/screens/invite.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
